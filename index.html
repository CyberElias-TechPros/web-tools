<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <title>Web Tools — 79 fast, private, in-browser utilities</title>
    <meta
      name="description"
      content="79 free developer, document and design tools that run entirely in your browser: combine Word documents into PDFs, merge, split and organise PDFs, convert Excel and PowerPoint files, compress images, generate QR codes, format JSON and SQL, test regexes and much more. No uploads, no accounts, no tracking."
    />
    <link rel="canonical" href="https://web-tools.vercel.app/" />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Web Tools" />
    <meta property="og:title" content="Web Tools — 79 fast, private, in-browser utilities" />
    <meta
      property="og:description"
      content="79 free developer, document and design tools that run entirely in your browser: combine Word documents into PDFs, merge, split and organise PDFs, convert Excel and PowerPoint files, compress images, generate QR codes, format JSON and SQL, test regexes and much more. No uploads, no accounts, no tracking."
    />
    <meta property="og:url" content="https://web-tools.vercel.app/" />
    <meta property="og:image" content="https://web-tools.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Web Tools — ten fast, private utilities that run entirely in your browser." />
    <meta property="og:locale" content="en" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Web Tools — 79 fast, private, in-browser utilities" />
    <meta
      name="twitter:description"
      content="79 free developer, document and design tools that run entirely in your browser: combine Word documents into PDFs, merge, split and organise PDFs, convert Excel and PowerPoint files, compress images, generate QR codes, format JSON and SQL, test regexes and much more. No uploads, no accounts, no tracking."
    />
    <meta name="twitter:image" content="https://web-tools.vercel.app/og.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Web Tools",
        "url": "https://web-tools.vercel.app/",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript. Works in any modern browser.",
        "description": "79 privacy-first browser utilities for documents, PDFs, images, data and code. All processing happens locally on your device.",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": [
          "Word (DOCX) to PDF combiner",
          "PDF merge, split, organise, watermark and page numbers",
          "PDF to images and images to PDF",
          "PDF text and metadata tools",
          "Excel, PowerPoint and Markdown converters",
          "Image compressor, resizer, converter and favicon generator",
          "QR code and placeholder generators",
          "JSON, YAML, SQL, XML and CSV formatters and converters",
          "Regular expression tester, text diff and hash generator",
          "Secure password and passphrase generator"
        ]
      }
    </script>

    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem('wt:theme');
          var system = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = t === 'dark' ? true : t === 'light' ? false : system;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* localStorage can be blocked; the default dark class stays. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif">
        <h1>Web Tools</h1>
        <p>
          These utilities do all of their work inside your browser, so JavaScript must be enabled to
          use them.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
